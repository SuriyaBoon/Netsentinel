# Dev-only tooling. The runtime package remains standard-library only and is
# still packaged by setup.py; this file configures linting, not builds.
[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.8"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

# Third-party test runner uses 3.10+ syntax; skip type-checking it since the
# project targets Python 3.8 and pytest is a dev-only dependency.
[[tool.mypy.overrides]]
module = "pytest.*"
ignore_errors = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "_pytest.*"
ignore_errors = true
follow_imports = "skip"
